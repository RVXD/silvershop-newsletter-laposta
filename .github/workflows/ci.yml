name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, sqlite3, pdo_sqlite, intl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # silvershop/newsletter is an RVXD module (not on Packagist); it is resolved from the composer
      # `repositories` VCS entry. A private newsletter repo needs a GitHub token with repo scope exported as
      # COMPOSER_AUTH (or `composer config -g github-oauth.github.com <token>`).
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHP_CodeSniffer
        run: composer run lint

      - name: Run PHPStan
        run: composer run stan

      - name: Run PHPUnit
        env:
          SS_ENVIRONMENT_TYPE: dev
          SS_DATABASE_CLASS: SQLite3Database
          SS_DATABASE_NAME: ss_test
          SS_SQLITE_DATABASE_PATH: ":memory:"
        run: vendor/bin/phpunit
